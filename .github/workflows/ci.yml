name: CI

# Regression CI for the Gomake Makefile template.
#
# Runs the fixture harness (scripts/test-gomake.sh) on Linux and macOS and
# shellchecks the harness. P13 will expand this to a full support matrix.
#
# Security: read-only token, no pull_request_target, and every action pinned to a
# full commit SHA, so fork PRs cannot run with write credentials.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Show tool versions
        run: |
          make --version | head -n1
          go version
      - name: Run regression harness
        run: scripts/test-gomake.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint shell scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning scripts/*.sh
